<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bloom — English Vocabulary</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

<script type="module">
  import { initializeApp }    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, onValue, push, remove, update }
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey:            "AIzaSyAbyctEFn8CEutjJ9V2VZpWCqlBF3Y6Nmg",
    authDomain:        "bloom-vocab.firebaseapp.com",
    databaseURL:       "https://bloom-vocab-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId:         "bloom-vocab",
    storageBucket:     "bloom-vocab.firebasestorage.app",
    messagingSenderId: "602258789171",
    appId:             "1:602258789171:web:b83b7c0e78d3fdd01ce446"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);
  
  // Export Firebase helpers to global window object
  window._fb = { db, ref, onValue, push, remove, update };
  document.dispatchEvent(new Event('fbReady'));
</script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --pink-50:#FFF0F5;--pink-100:#FFD6E7;--pink-200:#FFB3CF;--pink-300:#FF85B3;
  --pink-400:#F2607A;--pink-500:#D94070;
  --rose-bg:#FDF5F8;--card-bg:#FFFBFD;
  --text-main:#2A1420;--text-muted:#8B5F72;--text-light:#C4A0B0;
  --border:#F0D0DD;--border-strong:#E8B4C4;--white:#FFFFFF;
  --radius-sm:8px;--radius-md:14px;--radius-lg:22px;--radius-xl:32px;
  --shadow-soft:0 4px 24px rgba(185,60,110,.08);
  --shadow-card:0 2px 16px rgba(185,60,110,.1);
}
body{font-family:'DM Sans',sans-serif;background:var(--rose-bg);color:var(--text-main);min-height:100vh;display:flex;flex-direction:column}

/* ── LOADING ── */
#loading-overlay{position:fixed;inset:0;background:var(--rose-bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:300}
.logo2{font-family:'DM Serif Display',serif;font-size:32px;color:var(--pink-500)}
.spin-dots{display:flex;gap:6px}
.spin-dot{width:8px;height:8px;border-radius:50%;background:var(--pink-300);animation:pulse 1.2s ease-in-out infinite}
.spin-dot:nth-child(2){animation-delay:.2s}.spin-dot:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}

/* ── HEADER ── */
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--white);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;gap:8px;flex-wrap:wrap}
.logo{font-family:'DM Serif Display',serif;font-size:20px;color:var(--pink-500);letter-spacing:-.5px;display:flex;align-items:center;gap:6px;flex-shrink:0}
.logo-dot{width:7px;height:7px;border-radius:50%;background:var(--pink-300)}
nav{display:flex;gap:1px;flex-wrap:wrap}
nav button{background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;color:var(--text-muted);padding:6px 9px;border-radius:var(--radius-md);transition:all .15s;white-space:nowrap}
nav button:hover{background:var(--pink-50);color:var(--pink-500)}
nav button.active{background:var(--pink-50);color:var(--pink-500);font-weight:500;border:1px solid var(--border)}
.header-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
#sync-status{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-light)}
#sync-status.ok{color:#2e7d32}
#sync-status.err{color:#c62828}
#sync-status .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.streak-badge{display:flex;align-items:center;gap:4px;background:var(--pink-50);border:1px solid var(--border);padding:4px 9px;border-radius:20px;font-size:12px;color:var(--pink-500);font-weight:500}

/* ── SIDEBAR ── */
.sidebar{width:210px;flex-shrink:0;background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;transition:transform .25s}
.sidebar-header{padding:14px 12px 8px}
.sidebar-label{font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--text-light);margin-bottom:8px}
.new-group-form{display:flex;gap:5px}
.new-group-form input{flex:1;font-family:'DM Sans',sans-serif;font-size:13px;padding:7px 8px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--rose-bg);color:var(--text-main);outline:none;min-width:0}
.new-group-form button{background:var(--pink-400);color:white;border:none;border-radius:var(--radius-sm);padding:7px 9px;cursor:pointer;font-size:17px;line-height:1;flex-shrink:0}
.sidebar-all{display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:var(--radius-md);cursor:pointer;transition:all .13s;margin:7px 7px 2px}
.sidebar-all.active{background:var(--pink-50);border:1px solid var(--border)}
.group-list{flex:1;padding:3px 7px 14px}
.group-item{display:flex;align-items:center;gap:6px;padding:8px 9px;border-radius:var(--radius-md);cursor:pointer;transition:all .13s;margin-bottom:2px}
.group-item.active{background:var(--pink-50);border:1px solid var(--border)}
.group-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.group-name{font-size:13px;color:var(--text-main);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.group-actions{display:flex;gap:1px;opacity:0}
.group-item:hover .group-actions{opacity:1}

/* ── MAIN ── */
.app-shell{display:flex;flex:1;min-height:0;overflow:hidden}
main{flex:1;padding:20px 16px;overflow-y:auto}
.view{display:none}
.view.active{display:block}

/* ── WORDS ── */
.word-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px;margin-bottom:7px;display:flex;align-items:flex-start;gap:9px}
.word-term{font-family:'DM Serif Display',serif;font-size:16px;color:var(--text-main)}
.word-def{font-size:12px;color:var(--text-muted);margin-top:3px}

/* ── MOBILE ── */
@media(max-width:640px){
  .sidebar{position:fixed;top:0;left:0;height:100%;z-index:90;transform:translateX(-100%);width:240px}
  .sidebar.open{transform:translateX(0)}
  header nav{display:none}
  .bottom-nav{display:flex!important}
}
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--border);z-index:50;padding:6px 0}
.bottom-nav button{flex:1;background:none;border:none;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-muted)}
.bottom-nav button.active{color:var(--pink-500)}

/* ── MODALS ── */
.modal-backdrop{position:fixed;inset:0;background:rgba(42,20,32,.4);z-index:100;display:flex;align-items:center;justify-content:center}
.modal{background:var(--white);border-radius:var(--radius-xl);padding:22px;width:90%;max-width:360px}
</style>
</head>
<body>

<div id="loading-overlay">
  <div class="logo2">🌸 bloom</div>
  <div class="spin-dots"><div class="spin-dot"></div><div class="spin-dot"></div><div class="spin-dot"></div></div>
</div>

<header>
  <button class="menu-btn" onclick="toggleSidebar()" style="background:none;border:none;font-size:20px;cursor:pointer">☰</button>
  <div class="logo"><span class="logo-dot"></span>bloom</div>
  <nav>
    <button class="active" onclick="showView('list')">Words</button>
    <button onclick="showView('flashcard')">Flashcards</button>
    <button onclick="showView('quiz')">Quiz</button>
    <button onclick="showView('suggest')">Discover</button>
    <button onclick="showView('stats')">Progress</button>
  </nav>
  <div class="header-right">
    <div id="sync-status" class="ok"><span class="dot"></span><span id="sync-label">live</span></div>
    <div class="streak-badge">🌸 <span id="streak-count">0</span></div>
  </div>
</header>

<div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:80"></div>

<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-label">Collections</div>
      <div class="new-group-form">
        <input id="new-group-inp" type="text" placeholder="New collection…" maxlength="30" onkeydown="if(event.key==='Enter')createGroup()" />
        <button onclick="createGroup()">+</button>
      </div>
    </div>
    <div class="sidebar-all active" id="sidebar-all" onclick="selectGroup(null);closeSidebar()">
      <span>🌸</span><span style="flex:1;margin-left:8px">All Words</span>
      <span class="group-count" id="all-count">0</span>
    </div>
    <div class="group-list" id="group-list"></div>
  </aside>

  <main>
    <div class="view active" id="view-list">
      <div id="list-banner"></div>
      <div style="margin-bottom:15px; background:white; padding:10px; border-radius:15px; border:1px solid var(--border)">
        <label style="font-size:12px; color:var(--text-muted)">Your name:</label>
        <input id="nick-inp" type="text" placeholder="Anonymous" style="border:none; outline:none; margin-left:10px" onchange="saveNick()" />
      </div>
      
      <div style="display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap">
        <input id="inp-word" type="text" placeholder="Word" style="flex:1; padding:10px; border-radius:10px; border:1px solid var(--border-strong)" />
        <input id="inp-def" type="text" placeholder="Definition" style="flex:2; padding:10px; border-radius:10px; border:1px solid var(--border-strong)" />
        <select id="inp-pos" style="padding:10px; border-radius:10px; border:1px solid var(--border-strong)">
          <option value="">POS</option>
          <option value="noun">noun</option><option value="verb">verb</option>
          <option value="adj">adj</option><option value="phrase">phrase</option>
        </select>
        <button class="btn-primary" id="btn-add-word" onclick="addWord()" style="background:var(--pink-400); color:white; border:none; padding:10px 20px; border-radius:10px; cursor:pointer">Add</button>
      </div>
      <div id="word-list-container"></div>
    </div>

    <div class="view" id="view-flashcard"><h1>Flashcards View</h1></div>
    <div class="view" id="view-quiz"><h1>Quiz View</h1></div>
    <div class="view" id="view-suggest"><h1>Discover View</h1></div>
    <div class="view" id="view-stats"><h1>Progress View</h1></div>
  </main>
</div>

<div class="bottom-nav">
  <button class="active" onclick="showView('list')">📝<span>Words</span></button>
  <button onclick="showView('flashcard')">🃏<span>Cards</span></button>
  <button onclick="showView('quiz')">❓<span>Quiz</span></button>
  <button onclick="showView('suggest')">✦<span>Discover</span></button>
  <button onclick="showView('stats')">📊<span>Stats</span></button>
</div>

<script>
// ══════════════════════════════════════════════════════
//  STATE & HELPERS
// ══════════════════════════════════════════════════════
let words = [], groups = [];
let fbConnected = false;
let activeGroupId = null;
let _addingWord = false; 

const esc = (s) => {
  if (!s) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
};

const saveNick = () => {
  const n = document.getElementById('nick-inp').value;
  localStorage.setItem('bloom_nick', n);
};

// ══════════════════════════════════════════════════════
//  FIREBASE CORE
// ══════════════════════════════════════════════════════
document.addEventListener('fbReady', () => {
  fbConnected = true;
  initFirebase();
});

function initFirebase() {
  const { db, ref, onValue } = window._fb;

  // Listen for Groups
  onValue(ref(db, 'groups'), snap => {
    groups = [];
    snap.forEach(c => groups.push({ fbKey: c.key, ...c.val() }));
    renderSidebar();
  });

  // Listen for Words
  onValue(ref(db, 'words'), snap => {
    words = [];
    snap.forEach(c => words.push({ fbKey: c.key, ...c.val() }));
    words.sort((a, b) => (b.added || 0) - (a.added || 0));
    
    // Refresh UI
    renderWordList();
    renderSidebar();
    document.getElementById('loading-overlay').style.display = 'none';
  });
}

// ══════════════════════════════════════════════════════
//  ACTIONS
// ══════════════════════════════════════════════════════
async function addWord() {
  if (_addingWord) return;
  
  const w = document.getElementById('inp-word').value.trim();
  const d = document.getElementById('inp-def').value.trim();
  const p = document.getElementById('inp-pos').value;
  
  if (!w || !d) {
    alert("Please fill in word and definition");
    return;
  }

  _addingWord = true;
  const btn = document.getElementById('btn-add-word');
  btn.disabled = true;
  btn.textContent = "...";

  const nick = document.getElementById('nick-inp').value || 'Anonymous';

  try {
    const { db, ref, push } = window._fb;
    await push(ref(db, 'words'), {
      word: w,
      def: d,
      pos: p,
      addedBy: nick,
      groupId: activeGroupId || 'none',
      added: Date.now()
    });

    // Clear inputs
    document.getElementById('inp-word').value = '';
    document.getElementById('inp-def').value = '';
    document.getElementById('inp-word').focus();

  } catch (e) {
    console.error(e);
    alert("Error adding word");
  } finally {
    // CRITICAL FIX: Always reset adding flag
    _addingWord = false;
    btn.disabled = false;
    btn.textContent = "Add";
  }
}

function renderWordList() {
  const container = document.getElementById('word-list-container');
  const filtered = activeGroupId === null ? words : words.filter(w => w.groupId === activeGroupId);
  
  if (filtered.length === 0) {
    container.innerHTML = `<div style="text-align:center; color:#999; margin-top:30px">No words found.</div>`;
    return;
  }

  container.innerHTML = filtered.map((w, idx) => `
    <div class="word-card">
      <div style="flex:1">
        <div class="word-term">${esc(w.word)} <span style="font-size:10px; background:#eee; padding:2px 5px; border-radius:5px">${esc(w.pos)}</span></div>
        <div class="word-def">${esc(w.def)}</div>
        <div style="font-size:10px; color:#ccc; margin-top:5px">by ${esc(w.addedBy)}</div>
      </div>
      <button onclick="deleteWord('${w.fbKey}')" style="background:none; border:none; color:#ff85b3; cursor:pointer">✕</button>
    </div>
  `).join('');
}

async function deleteWord(key) {
  if (!confirm("Delete this word?")) return;
  const { db, ref, remove } = window._fb;
  await remove(ref(db, `words/${key}`));
}

function renderSidebar() {
  document.getElementById('all-count').textContent = words.length;
  const list = document.getElementById('group-list');
  list.innerHTML = groups.map(g => {
    const count = words.filter(w => w.groupId === g.fbKey).length;
    return `
      <div class="group-item ${activeGroupId === g.fbKey ? 'active' : ''}" onclick="selectGroup('${g.fbKey}')">
        <span class="group-dot" style="background:${g.color || '#f2607a'}"></span>
        <span class="group-name">${esc(g.name)}</span>
        <span style="font-size:10px; color:#999">${count}</span>
      </div>
    `;
  }).join('');
}

function selectGroup(id) {
  activeGroupId = id;
  const allBtn = document.getElementById('sidebar-all');
  if (id === null) allBtn.classList.add('active');
  else allBtn.classList.remove('active');
  renderSidebar();
  renderWordList();
}

function showView(v) {
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  document.getElementById('view-' + v).classList.add('active');
  // Update nav buttons
  document.querySelectorAll('nav button, .bottom-nav button').forEach(b => b.classList.remove('active'));
}

function toggleSidebar() {
  const s = document.getElementById('sidebar');
  const o = document.getElementById('sidebar-overlay');
  s.classList.toggle('open');
  o.style.display = s.classList.contains('open') ? 'block' : 'none';
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').style.display = 'none';
}

// Init local nick
document.getElementById('nick-inp').value = localStorage.getItem('bloom_nick') || '';
</script>
</body>
</html>
